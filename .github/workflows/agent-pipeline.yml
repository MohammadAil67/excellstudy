name: Agent Pipeline Validation

on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
    inputs:
      agent_slug:
        description: 'Agent Slug to manually validate'
        required: true
        type: string
      version:
        description: 'Version tag to validate'
        required: true
        type: string
        default: 'v1'
      developer_namespace:
        description: 'The developer namespace (e.g. dev-alex304)'
        required: true
        type: string
        default: ''

env:
  PLATFORM_API_URL: "https://excellstudy.site"
  EXCELLSTUDY_HOST: "https://excellstudy.site"
  PIPELINE_WEBHOOK_SECRET: ${{ secrets.PIPELINE_WEBHOOK_SECRET }}

jobs:
  validate-and-deploy:
    runs-on: self-hosted   # must be self-hosted — GitHub's cloud
                            # runners cannot reach your minikube cluster

    steps:
      # ─────────────────────────────────────────────
      # 0. Resolve which agent/version this run is for
      # ─────────────────────────────────────────────
      - name: Resolve agent identity
        id: identity
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ inputs.agent_slug }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "developer_namespace=${{ inputs.developer_namespace }}" >> $GITHUB_OUTPUT
          else
            echo "slug=${{ github.event.registry_package.name }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.registry_package.package_version.container_metadata.tag.name }}" >> $GITHUB_OUTPUT
            echo "developer_namespace=dev-${{ github.actor }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      # FIXED — removed actions/setup-python@v5 entirely.
      # It failed with "version 3.12 not found for this OS/arch"
      # because GitHub's hosted Python binary manifest doesn't
      # cover this runner's exact Debian/WSL2 environment.
      # The runner already has Python 3.13.5 installed natively —
      # use that instead of trying to download a separate one.
      - name: Verify Python is available
        run: |
          python3 --version
          python3 -m pip --version

      # FIXED — added --break-system-packages to both pip calls.
      # Debian 12+/newer Python enforces PEP 668, which blocks
      # `pip install` from touching the system-managed Python
      # environment by default. This is a throwaway CI runner
      # environment (not your dev machine's Python), so bypassing
      # this protection here is low-risk.
      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install requests --break-system-packages

      # ─────────────────────────────────────────────
      # 1. Pull the image and extract its manifest
      # ─────────────────────────────────────────────
      - name: Docker login to ghcr.io
        run: |
          TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image and extract manifest
        id: extract
        run: |
          IMAGE_TAG="ghcr.io/${{ steps.identity.outputs.owner_lower }}/${{ steps.identity.outputs.slug }}:${{ steps.identity.outputs.version }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          docker pull "$IMAGE_TAG"
          CONTAINER_ID=$(docker create "$IMAGE_TAG")
          docker cp "$CONTAINER_ID:/app/manifest.json" ./manifest.json
          docker rm "$CONTAINER_ID"

      - name: Pull image — notify failure
        if: failure() && steps.extract.outcome == 'failure'
        run: |
          MSG="Image pull failed: ghcr.io/${{ steps.identity.outputs.owner_lower }}/${{ steps.identity.outputs.slug }}:${{ steps.identity.outputs.version }} could not be pulled from registry or /app/manifest.json was missing."
          echo "$MSG" > error_reason.txt
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" extract failure "$MSG"

      # ─────────────────────────────────────────────
      # 2. Schema check — cross-validate against the
      #    pending AgentRegistry row (registered in the
      #    dev portal BEFORE this push happened)
      # ─────────────────────────────────────────────
      - name: Schema check — notify running
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" schema_validation running

      - name: Schema check
        id: schema_check
        run: |
          python3 scripts/validate_manifest.py ./manifest.json "${{ steps.identity.outputs.slug }}" 2>&1 | tee error_reason_raw.txt

      - name: Schema check — notify failure
        if: failure() && steps.schema_check.outcome == 'failure'
        run: |
          REASON=$(grep -E 'Rejection:|Error:' error_reason_raw.txt | tail -n 1 || echo "")
          if [ -z "$REASON" ]; then
            REASON="Schema validation failed: manifest.json is invalid or mismatched."
          fi
          echo "$REASON" > error_reason.txt
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" schema_validation failure "$REASON"

      # ─────────────────────────────────────────────
      # 3. Security scan — CVEs + non-root check
      # ─────────────────────────────────────────────
      - name: Security scan — notify running
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" security_scan running

      - name: Security scan — CVE check
        id: security_cve
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.extract.outputs.image_tag }}
          exit-code: 1
          severity: CRITICAL

      - name: Security scan — non-root check
        id: security_root
        run: |
          USER=$(docker inspect "${{ steps.extract.outputs.image_tag }}" --format='{{.Config.User}}')
          if [ -z "$USER" ] || [ "$USER" = "root" ] || [ "$USER" = "0" ]; then
            echo "Container runs as root — rejected."
            exit 1
          fi
          echo "Running as non-root user: $USER"

      - name: Security scan — notify success
        if: success()
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" security_scan success

      - name: Security scan — notify failure
        if: failure() && (steps.security_cve.outcome == 'failure' || steps.security_root.outcome == 'failure')
        run: |
          MSG="Security scan failed."
          if [ "${{ steps.security_cve.outcome }}" = "failure" ]; then
            MSG="Security scan failed: Critical CVE vulnerabilities detected in the container image."
          elif [ "${{ steps.security_root.outcome }}" = "failure" ]; then
            MSG="Security scan failed: The container must not run as root. Specify a non-root USER in your Dockerfile."
          fi
          echo "$MSG" > error_reason.txt
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" security_scan failure "$MSG"

      # ─────────────────────────────────────────────
      # 4. Smoke test — spin up the container and hit
      #    its real endpoints with synthetic input
      # ─────────────────────────────────────────────
      - name: Smoke test — notify running
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" smoke_test running

      - name: Smoke test
        id: smoke_test
        run: |
          SLUG="${{ steps.identity.outputs.slug }}"
          IMAGE_TAG="${{ steps.extract.outputs.image_tag }}"

          docker run -d --name "smoke-test-$SLUG" -p 8099:8080 "$IMAGE_TAG"
          sleep 8

          curl -sf http://localhost:8099/health

          curl -sf -X POST http://localhost:8099/invoke \
            -H "Content-Type: application/json" \
            -d '{"input": {"value": "test"}, "context": {"learner_id": "smoke-test"}}'

      - name: Cleanup smoke test container
        if: always()
        run: |
          SLUG="${{ steps.identity.outputs.slug }}"
          docker stop "smoke-test-$SLUG" || true
          docker rm "smoke-test-$SLUG" || true

      - name: Smoke test — notify success
        if: success()
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" smoke_test success

      - name: Smoke test — notify failure
        if: failure() && steps.smoke_test.outcome == 'failure'
        run: |
          MSG="Smoke test failed: The agent did not respond properly to health check or invoke request."
          echo "$MSG" > error_reason.txt
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" smoke_test failure "$MSG"

      # ─────────────────────────────────────────────
      # 5. Deploy — namespace, quota, deployment, service
      # ─────────────────────────────────────────────
      - name: Deploy to cluster — notify running
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" deploy running

      - name: Deploy to cluster
        id: deploy
        run: |
          NAMESPACE="${{ steps.identity.outputs.developer_namespace }}"
          SLUG="${{ steps.identity.outputs.slug }}"
          IMAGE_TAG="${{ steps.extract.outputs.image_tag }}"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret -n "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: ${{ steps.identity.outputs.developer_namespace }}-quota
            namespace: $NAMESPACE
          spec:
            hard:
              pods: "5"
              requests.memory: "1Gi"
              requests.cpu: "1"
              limits.memory: "2Gi"
              limits.cpu: "2"
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $SLUG
            namespace: $NAMESPACE
            labels:
              app: $SLUG
              developer: "${{ github.actor }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: $SLUG
            template:
              metadata:
                labels:
                  app: $SLUG
              spec:
                imagePullSecrets:
                - name: ghcr-secret
                containers:
                - name: $SLUG
                  image: $IMAGE_TAG
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8080
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 10
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 10
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${SLUG}-svc
            namespace: $NAMESPACE
          spec:
            selector:
              app: $SLUG
            ports:
            - port: 80
              targetPort: 8080
          EOF

          kubectl wait --for=condition=ready pod \
            -l app="$SLUG" -n "$NAMESPACE" --timeout=60s

          echo "service_url=http://${SLUG}-svc.${NAMESPACE}.svc.cluster.local" >> $GITHUB_OUTPUT

      - name: Deploy to cluster — notify success
        if: success()
        run: |
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" deploy success

      - name: Deploy to cluster — notify failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          MSG="Deployment failed: Kubernetes cluster took too long to start the pod or was out of resources."
          echo "$MSG" > error_reason.txt
          python3 scripts/notify_step.py "${{ steps.identity.outputs.slug }}" deploy failure "$MSG"

      # ─────────────────────────────────────────────
      # 7. Notify Django — payload matches the ACTUAL
      #    pipeline_webhook view contract exactly:
      #    agent_slug, status, k8s_service_url,
      #    rejection_reason, version
      # ─────────────────────────────────────────────
      - name: Notify Django — success
        if: success()
        run: |
          SLUG="${{ steps.identity.outputs.slug }}"
          VERSION="${{ steps.identity.outputs.version }}"
          K8S_URL="${{ steps.deploy.outputs.service_url }}"
          PAYLOAD=$(python3 -c 'import json, sys; print(json.dumps({"agent_slug": sys.argv[1], "status": "success", "version": sys.argv[2], "k8s_service_url": sys.argv[3]}))' "$SLUG" "$VERSION" "$K8S_URL")

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.PIPELINE_WEBHOOK_SECRET }}" | sed 's/^.* //')

          curl -sf -X POST "${{ env.PLATFORM_API_URL }}/api/v1/pipeline/webhook/" \
            -H "Content-Type: application/json" \
            -H "X-Pipeline-Signature: $SIGNATURE" \
            -d "$PAYLOAD"

      - name: Notify Django — failure
        if: failure()
        run: |
          SLUG="${{ steps.identity.outputs.slug }}"
          if [ -f error_reason.txt ]; then
            REASON=$(cat error_reason.txt)
          else
            REASON="Pipeline validation failed - check the Actions run logs for the specific step and reason."
          fi
          PAYLOAD=$(python3 -c 'import json, sys; print(json.dumps({"agent_slug": sys.argv[1], "status": "failure", "rejection_reason": sys.argv[2]}))' "$SLUG" "$REASON")

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.PIPELINE_WEBHOOK_SECRET }}" | sed 's/^.* //')

          curl -X POST "${{ env.PLATFORM_API_URL }}/api/v1/pipeline/webhook/" \
            -H "Content-Type: application/json" \
            -H "X-Pipeline-Signature: $SIGNATURE" \
            -d "$PAYLOAD"