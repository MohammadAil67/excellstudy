{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reject Post — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 36px; max-width: 520px; width: 100%; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #f1f5f9; margin-bottom: 6px; }
    .post-title { color: #f5c800; font-size: 0.9rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
    textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-family: inherit; font-size: 0.9rem; resize: vertical; transition: border-color .2s; }
    textarea:focus { outline: none; border-color: #f5c800; }
    .actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .btn { padding: 10px 22px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; text-decoration: none; display: inline-block; }
    .btn-reject { background: #dc2626; color: #fff; }
    .btn-reject:hover { background: #b91c1c; }
    .btn-cancel { background: #334155; color: #e2e8f0; }
    .btn-cancel:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reject Blog Post</h1>
    <div class="post-title">{{ post.title }}</div>
    <form method="post">
      {% csrf_token %}
      <label for="id_rejection_reason">Rejection Reason</label>
      {{ form.rejection_reason }}
      <div class="actions">
        <a href="{% url 'admin_panel:blog' %}" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-reject">Reject Post</button>
      </div>
    </form>
  </div>
</body>
</html>
