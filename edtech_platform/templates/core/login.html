{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — ExcellStudy</title>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #0A0A0A;
      --primary-light: #FFE000;
      --primary-dark: #000000;
      --accent: #BA7517;
      --accent-light: #0A0A0A;
      --bg: #FAFAF8;
      --bg-card: #FFFFFF;
      --text-primary: #0A0A0A;
      --text-secondary: #6B7280;
      --border: #E5E5E2;
      --shadow: 0 4px 20px rgba(10, 10, 10, 0.08);
      --radius-card: 12px;
      --radius-input: 8px;
    }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .login-container {
      animation: fadeInUp 0.5s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10, 10, 10, 0.12);
    }

    .logo-mark img { transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo-mark:hover img { transform: scale(1.045) rotate(-1deg); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <!-- Background decorative glows -->
  <div class="absolute w-[400px] h-[400px] rounded-full filter blur-[100px] opacity-20 pointer-events-none -top-20 -left-20" style="background:var(--primary);"></div>
  <div class="absolute w-[400px] h-[400px] rounded-full filter blur-[100px] opacity-20 pointer-events-none -bottom-20 -right-20" style="background:var(--accent);"></div>

  <div class="login-container w-full max-w-[420px] bg-white rounded-2xl border border-[#E5E5E2] p-8 relative z-10" style="box-shadow: var(--shadow);">
    
    <!-- Header Logo -->
    <a href="/" class="logo-mark flex items-center justify-center select-none mb-8" style="text-decoration:none;">
      <img src="{% static 'img/logo.png' %}" alt="EXcell.study" style="height:30px;width:auto;display:block;">
    </a>

    <h2 class="text-xl font-bold text-center mb-1">Welcome back</h2>
    <p class="text-xs text-center text-gray-500 mb-6">Enter your details to log in to your account</p>



    <!-- Django Messages -->
    {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded-lg text-xs font-semibold flex items-center gap-2 {% if message.tags == 'error' %}bg-red-50 text-red-600 border border-red-100{% else %}bg-green-50 text-green-600 border border-green-100{% endif %}">
            {% if message.tags == 'error' %}
              <i data-lucide="alert-circle" class="w-4 h-4"></i>
            {% else %}
              <i data-lucide="check-circle" class="w-4 h-4"></i>
            {% endif %}
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">Username</label>
        <div class="relative">
          <input type="text" name="username" required class="input-field pl-10" placeholder="yourusername">
          <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">Password</label>
        <div class="relative">
          <input type="password" name="password" required class="input-field pl-10" placeholder="••••••••">
          <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
        </div>
      </div>

      <button type="submit" class="w-full py-3 rounded-lg text-sm font-bold text-white transition-all select-none hover:shadow-lg mt-2" style="background:var(--primary); box-shadow: 0 4px 14px rgba(10, 10, 10, 0.2);">
        Log In
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-[#E5E5E2] text-center text-xs text-gray-500">
      Don't have an account? 
      <a href="{% url 'signup' %}" class="font-semibold transition-colors hover:underline" style="color:var(--primary);">Sign Up</a>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
