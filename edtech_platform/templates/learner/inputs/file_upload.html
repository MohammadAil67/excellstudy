<form id="agent-input-form" data-input-type="file_upload">
  {% csrf_token %}
  <div class="space-y-4">
    <!-- Drag & Drop Zone -->
    <div id="drop-zone" class="border-2 border-dashed border-[#534AB7]/30 hover:border-[#534AB7] bg-[#F8F7FF] rounded-lg p-8 text-center cursor-pointer transition-all">
      <input type="file" id="file-input" accept="*/*" class="hidden">
      <div class="flex flex-col items-center gap-2">
        <div class="w-12 h-12 rounded-full bg-[#534AB7]/10 flex items-center justify-center">
          <i data-lucide="file-up" class="w-6 h-6 text-[#534AB7]"></i>
        </div>
        <p class="text-sm font-semibold text-[#1A1A2E]">Drag & Drop your file here</p>
        <p class="text-xs text-[#6B7280]">or click to browse from files (PDF, DOCX, TXT, CSV, Max 25MB)</p>
      </div>
    </div>

    <!-- Preview & Status -->
    <div id="upload-status-container" class="hidden p-3 rounded-lg border flex items-center justify-between gap-3 bg-white border-[#E5E4F0]">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-10 h-10 rounded-md bg-[#534AB7]/10 flex items-center justify-center border border-[#E5E4F0]">
          <i data-lucide="file-text" class="w-5 h-5 text-[#534AB7]"></i>
        </div>
        <div class="min-w-0">
          <span id="upload-filename" class="text-xs font-semibold text-[#1A1A2E] truncate block">document.pdf</span>
          <span id="upload-progress-text" class="text-[10px] text-[#6B7280]">Ready to submit</span>
        </div>
      </div>
      <button type="button" id="remove-file-btn" class="text-[#6B7280] hover:text-[#E05252] transition-colors p-1">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>

    <input type="hidden" name="file_url" id="hidden-file-url">

    <div class="flex justify-end">
      <button type="submit" id="file-submit-btn" class="btn btn-primary" style="padding:10px 28px;" disabled>Submit File</button>
    </div>
  </div>
</form>
