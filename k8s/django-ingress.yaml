# ── Django Ingress & TLS Certificate Configuration ──────────────────────────
# Namespace: platform
# Routes external HTTP/HTTPS traffic to django-service on port 8000.
# Integrates with cert-manager + Let's Encrypt for automatic SSL.
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - excellstudy.site
        - www.excellstudy.site
      secretName: excellstudy-tls-secret
  rules:
    - host: excellstudy.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
    - host: www.excellstudy.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 8000
