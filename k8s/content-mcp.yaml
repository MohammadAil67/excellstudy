# ── Content MCP Server ────────────────────────────────────────────────────────
# Namespace: platform  |  Port: 8003
# Exposes pgvector semantic search and course/module retrieval to agents.
# Only reachable by pods in the platform and agent namespaces (NetworkPolicy).
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-mcp-server
  namespace: platform
  labels:
    app: content-mcp-server
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-mcp-server
  template:
    metadata:
      labels:
        app: content-mcp-server
        component: mcp-server
    spec:
      imagePullSecrets:
        - name: gar-secret
      containers:
        - name: content-mcp
          image: asia-south1-docker.pkg.dev/excellstudy/excellstudy/content-mcp:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          resources:
            requests:
              memory: "64Mi"
              cpu: "30m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: platform-credentials
          env:
            - name: MCP_SERVER_PORT
              value: "8003"
---
apiVersion: v1
kind: Service
metadata:
  name: content-mcp-server
  namespace: platform
spec:
  selector:
    app: content-mcp-server
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: content-mcp-ingress
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: content-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
    - from:
        - namespaceSelector:
            matchLabels:
              role: agent-namespace
