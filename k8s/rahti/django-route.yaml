  name: django-route
  namespace: sdx-assignment-mmahdi
  labels:
    app: django-web
spec:
  to:
    kind: Service
    name: django-service
    weight: 100
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
